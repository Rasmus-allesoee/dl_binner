name: Installed CPU prototype

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build, install and check isolated CPU product
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME PYTHONUSERBASE
          out="$RUNNER_TEMP/e008-dev3"
          mkdir "$out"
          trap 'rc=$?; printf "CI_EXIT_CODE=%s\n" "$rc" | tee -a "$out/ci-terminal.log"; exit "$rc"' EXIT
          timeout --signal=TERM --kill-after=10s 3300s bash -s -- "$out" "$GITHUB_WORKSPACE" <<'RUN' 2>&1 | tee "$out/ci-terminal.log"
          set -euo pipefail
          out=$1
          source=$2
          cd "$source"
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -I -B -m venv --copies "$out/builder-0.1.0.dev3-v1"
          python -I -B -m venv --copies "$out/binner-0.1.0.dev3-v1"
          build="$out/builder-0.1.0.dev3-v1/bin/python"
          binner="$out/binner-0.1.0.dev3-v1/bin/python"
          "$build" -I -B -m pip --isolated install --only-binary=:all: -r requirements/build.txt
          "$binner" -I -B -m pip --isolated install --no-deps --only-binary=:all: 'torch==2.2.2+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$binner" -I -B -m pip --isolated install --only-binary=:all: -r requirements/binner-cpu.txt
          mkdir "$out/dist" "$out/rebuilt"
          "$build" -I -B -c 'from setuptools.build_meta import build_sdist; import sys; build_sdist(sys.argv[1])' "$out/dist"
          "$build" -I -B -c 'from setuptools.build_meta import build_wheel; import sys; build_wheel(sys.argv[1])' "$out/dist"
          "$build" -I -B -m pip --isolated wheel --no-deps --no-build-isolation --wheel-dir "$out/rebuilt" "$out/dist/dl_binner-0.1.0.dev3.tar.gz"
          "$build" -I -B scripts/check_distribution.py --wheel "$out/dist/dl_binner-0.1.0.dev3-py3-none-any.whl" --sdist "$out/dist/dl_binner-0.1.0.dev3.tar.gz" --rebuilt-wheel "$out/rebuilt/dl_binner-0.1.0.dev3-py3-none-any.whl" --output "$out/inspection.json"
          "$binner" -I -B -m pip --isolated install --no-deps "$out/rebuilt/dl_binner-0.1.0.dev3-py3-none-any.whl"
          "$binner" -I -B -m pip check
          "$binner" -I -B scripts/check_runtime.py --role binner --requirements requirements/binner-cpu.txt --threads 2 --output "$out/binner-runtime.json"
          python -I -B scripts/test_product.py --python "$binner" --threads 2 --timeout 1800 --output "$out/product"
          python -I -B scripts/check_docs.py
          RUN
      - name: Retain build and test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-prototype-evidence
          path: |
            ${{ runner.temp }}/e008-dev3/ci-terminal.log
            ${{ runner.temp }}/e008-dev3/inspection.json
            ${{ runner.temp }}/e008-dev3/*-runtime.json
            ${{ runner.temp }}/e008-dev3/dist/
            ${{ runner.temp }}/e008-dev3/rebuilt/
            ${{ runner.temp }}/e008-dev3/product/
          if-no-files-found: warn
          retention-days: 14
