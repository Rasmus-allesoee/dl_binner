name: Installed CPU prototype

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      VECLIB_MAXIMUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build, install and check isolated CPU product
        shell: bash
        run: |
          set -euo pipefail
          test "$(nproc)" -ge 4
          unset PYTHONPATH PYTHONHOME PYTHONUSERBASE
          out="$RUNNER_TEMP/cpu-candidate"
          mkdir "$out"
          trap 'rc=$?; printf "CI_EXIT_CODE=%s\n" "$rc" | tee -a "$out/ci-terminal.log"; exit "$rc"' EXIT
          timeout --signal=TERM --kill-after=10s 3300s bash -s -- "$out" "$GITHUB_WORKSPACE" <<'RUN' 2>&1 | tee "$out/ci-terminal.log"
          set -euo pipefail
          out=$1
          source=$2
          cd "$source"
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -I -B -m venv --copies "$out/builder"
          python -I -B -m venv --copies "$out/binner"
          build="$out/builder/bin/python"
          binner="$out/binner/bin/python"
          "$build" -I -B -m pip --isolated install --only-binary=:all: -r requirements/build.txt
          "$binner" -I -B -m pip --isolated install --no-deps --only-binary=:all: 'torch==2.2.2+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$binner" -I -B -m pip --isolated install --only-binary=:all: -r requirements/candidate-cpu.txt
          python -I -B scripts/build_candidate.py --python "$build" --output "$out/build" --threads 2 --timeout 300
          wheels=("$out/build/rebuilt/"*.whl)
          test "${#wheels[@]}" -eq 1
          "$binner" -I -B -m pip --isolated install --no-deps "${wheels[0]}"
          "$binner" -I -B -m pip check
          "$binner" -I -B scripts/check_runtime.py --role candidate --requirements requirements/candidate-cpu.txt --threads 4 --output "$out/binner-runtime.json"
          python -I -B scripts/test_product.py --python "$binner" --threads 4 --timeout 1800 --output "$out/product"
          python -I -B scripts/check_docs.py
          RUN
      - name: Retain build and test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-prototype-evidence
          path: |
            ${{ runner.temp }}/cpu-candidate/ci-terminal.log
            ${{ runner.temp }}/cpu-candidate/build/
            ${{ runner.temp }}/cpu-candidate/*-runtime.json
            ${{ runner.temp }}/cpu-candidate/product/
          if-no-files-found: warn
          retention-days: 14
